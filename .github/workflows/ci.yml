name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build da aplicação
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do Next.js
        run: npm run build

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Constrói a mesma imagem que o Discloud vai montar, para o erro
      # aparecer aqui e não no deploy.
      - name: docker build
        run: docker build -t site-pessoal:ci .

  migracoes:
    name: Migrations contra MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: site
          MYSQL_USER: site
          MYSQL_PASSWORD: site
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Aplicar migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: site
          DB_USER: site
          DB_PASS: site
        run: npm run db:migrate

      - name: Conferir que não sobrou nada pendente
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: site
          DB_USER: site
          DB_PASS: site
        run: npm run db:migrate:status
